name: Aevora checks

on:
  push:
    branches: ["main", "aevora/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      # The legacy client tree predates rustfmt and contains existing formatting
      # drift. Keep the new standalone runner checked without reformatting the
      # unrelated application source as part of this feature branch.
      - name: Check Luau runner formatting
        run: cargo fmt --manifest-path tools/aevora-luau/Cargo.toml -- --check
      - name: Test desktop client
        run: cargo test --workspace
      - name: Build Luau runner
        run: cargo build --manifest-path tools/aevora-luau/Cargo.toml
      - name: Run Luau smoke test
        run: cargo run --manifest-path tools/aevora-luau/Cargo.toml -- --script scripts/examples/hello.luau
      - name: Run isolated-worker smoke test
        run: cargo run --manifest-path tools/aevora-luau/Cargo.toml -- --script scripts/examples/worker-info.luau --instances 2
