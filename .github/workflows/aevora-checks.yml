name: Aevora checks

on:
  push:
    branches: ["main", "aevora/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test desktop client
        run: cargo test --workspace
      - name: Build Luau runner
        run: cargo build --manifest-path tools/aevora-luau/Cargo.toml
      - name: Run Luau smoke test
        run: cargo run --manifest-path tools/aevora-luau/Cargo.toml -- --script scripts/examples/hello.luau
